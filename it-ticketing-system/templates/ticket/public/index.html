<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال تذكرة دعم فني - القرية المتوسطية</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans flex flex-col justify-between">

    <!-- الهيدر الرسمي -->
    <header class="bg-slate-900 text-white shadow-lg border-b border-slate-700 py-4 px-6 text-center">
        <h1 class="text-xl font-bold text-amber-400">المؤسسة العمومية لتسيير القرية المتوسطية</h1>
        <p class="text-xs text-slate-300 mt-1">نظام الدعم الفني وتذاكر IT</p>
    </header>

    <!-- نموذج الإرسال -->
    <main class="container mx-auto px-4 py-8 max-w-lg">
        <div class="bg-white rounded-xl shadow-md p-6 border border-slate-200">
            <h2 class="text-xl font-bold mb-4 text-slate-800 border-b pb-2 text-center">فتح تذكرة دعم جديدة</h2>
            
            <form id="employeeForm" onsubmit="submitTicket(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">اسم الموظف <span class="text-red-500">*</span></label>
                    <input type="text" id="employee_name" required placeholder="أدخل اسمك الكامل" class="w-full border border-slate-300 rounded-lg p-2.5 text-black focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">المصلحة / القسم <span class="text-red-500">*</span></label>
                    <select id="department" required class="w-full border border-slate-300 rounded-lg p-2.5 text-black focus:ring-2 focus:ring-blue-500">
                        <option value="">-- اختر المصلحة --</option>
                        <option value="مصلحة الإعلام الآلي والشبكات">مصلحة الإعلام الآلي والشبكات</option>
                        <option value="مصلحة الوسائل العامة">مصلحة الوسائل العامة</option>
                        <option value="مصلحة الاستقبال والأمن">مصلحة الاستقبال والأمن</option>
                        <option value="الإدارة العامة">الإدارة العامة</option>
                        <option value="الموارد البشرية والمالية">الموارد البشرية والمالية</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">وصف المشكلة <span class="text-red-500">*</span></label>
                    <input type="text" id="title" required placeholder="اكتب عنواناً شاملاً للمشكلة" class="w-full border border-slate-300 rounded-lg p-2.5 text-black focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">درجة الأولوية</label>
                    <select id="priority" class="w-full border border-slate-300 rounded-lg p-2.5 text-black">
                        <option value="P3">عادية (P3)</option>
                        <option value="P2">متوسطة (P2)</option>
                        <option value="P1">عاجلة جداً (P1)</option>
                    </select>
                </div>

                <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition">
                    إرسال التذكرة إلى قسم IT
                </button>
            </form>

            <div id="successMsg" class="hidden mt-4 p-4 bg-green-100 text-green-800 rounded-lg text-center font-bold">
                تم إرسال تذكرتك بنجاح! سيتم معالجتها من طرف فريق الإعلام الآلي.
            </div>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-slate-500">
        إشراف وتطوير المهندس: <span class="font-bold text-slate-700">BENMESROUF ISLAM</span>
    </footer>

    <script>
        async function submitTicket(e) {
            e.preventDefault();
            const name = document.getElementById('employee_name').value.trim();
            const dept = document.getElementById('department').value;
            const title = document.getElementById('title').value.trim();
            const priority = document.getElementById('priority').value;

            const res = await fetch('/api/tickets', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ created_by: `${name} - ${dept}`, title, priority })
            });

            if (res.ok) {
                document.getElementById('employeeForm').reset();
                document.getElementById('successMsg').classList.remove('hidden');
                setTimeout(() => document.getElementById('successMsg').classList.add('hidden'), 5000);
            }
        }
    </script>
</body>
</html>
